<style>
:root{--bg:#F4F2ED;--navy:#1B2635;--amber:#B8870A;--red:#C5402B;--green:#1F7A4E;--gray:#888;--rule:rgba(27,38,53,.1)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Karla,sans-serif;background:var(--bg);color:var(--navy);font-size:13px}
header{background:var(--navy);color:#fff;border-bottom:3px solid var(--amber);padding:14px 28px;display:flex;align-items:center;gap:20px}
.brand{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:700;font-size:22px}
.sub-hdr{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:2px;color:var(--amber);text-transform:uppercase}
.meta{margin-left:auto;text-align:right;font-family:'JetBrains Mono',monospace;font-size:10px;color:rgba(255,255,255,.5);line-height:1.7}
.meta b{color:var(--amber)}
main{max-width:1400px;margin:0 auto;padding:20px 28px}
.toolbar{display:flex;align-items:center;gap:12px;margin-bottom:12px;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--gray)}
.toolbar input,.toolbar select{border:1px solid var(--rule);background:#fff;padding:5px 10px;border-radius:3px;font-family:inherit;font-size:11px}
.toolbar input{width:220px}
.toolbar select{width:160px;color:var(--navy);cursor:pointer}
#count{margin-left:auto}
.btn-export{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:1px;text-transform:uppercase;background:var(--navy);color:#fff;border:none;padding:5px 12px;border-radius:3px;cursor:pointer;white-space:nowrap}
.btn-export:hover{background:#2a3d55}
.card{background:#fff;border-radius:4px;overflow:hidden;box-shadow:0 1px 4px rgba(27,38,53,.07)}
table{width:100%;border-collapse:collapse}
thead{background:var(--navy);color:#fff}
th{font-family:'JetBrains Mono',monospace;font-size:8.5px;letter-spacing:1.5px;text-transform:uppercase;padding:8px 10px;text-align:left;font-weight:500;white-space:nowrap;cursor:pointer;user-select:none}
th:hover{background:rgba(255,255,255,.08)}
.sub{display:block;font-size:8px;opacity:.5;font-weight:400;margin-top:1px}
.si{margin-left:3px;opacity:.7}
tbody tr{border-bottom:1px solid var(--rule)}
tbody tr:last-child{border:none}
tbody tr:hover{background:rgba(184,135,10,.04)}
td{padding:7px 10px;vertical-align:middle}
.ct{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:12px;width:80px}
.cn{font-size:12px;color:#333;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cs{font-size:11px;color:var(--gray);max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cx{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--gray)}
.cm,.cp,.cr{font-family:'JetBrains Mono',monospace;font-size:11px;text-align:right}
.cr{border-left:1px solid var(--rule);padding:4px 10px}
.cr-ret{border-left:1px solid var(--rule);padding:4px 5px;text-align:right;font-family:'JetBrains Mono',monospace;font-size:11px}
.cr-score{border-left:2px solid var(--amber);padding:4px 10px;text-align:right;font-family:'JetBrains Mono',monospace;font-size:11px;background:rgba(184,135,10,.07)}
.mcap-filter{display:flex;align-items:center;gap:10px;flex:1;max-width:360px}
.mcap-lbl{white-space:nowrap;color:var(--gray)}
.mcap-val{white-space:nowrap;min-width:120px;color:var(--navy);font-weight:500}
.rng-wrap{position:relative;flex:1;height:20px}
.rng-track{position:absolute;top:8px;left:0;right:0;height:4px;background:rgba(27,38,53,.12);border-radius:2px}
.rng-fill{position:absolute;top:8px;height:4px;background:var(--amber);border-radius:2px}
.rng-wrap input[type=range]{position:absolute;width:100%;top:0;height:20px;appearance:none;-webkit-appearance:none;background:transparent;pointer-events:none;margin:0}
.rng-wrap input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;pointer-events:all;width:14px;height:14px;border-radius:50%;background:var(--amber);cursor:grab;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.rng-wrap input[type=range]::-webkit-slider-thumb:active{cursor:grabbing;background:#D4A017}
.rng-wrap input[type=range]::-moz-range-thumb{pointer-events:all;width:14px;height:14px;border-radius:50%;background:var(--amber);cursor:grab;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.filter-bar{display:flex;gap:16px;margin-bottom:12px;background:#fff;border-radius:4px;padding:10px 16px;box-shadow:0 1px 4px rgba(27,38,53,.07)}
.flt-group{display:flex;align-items:center;gap:8px;flex:1}
.flt-lbl{white-space:nowrap;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--gray);min-width:68px}
.flt-val{white-space:nowrap;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--navy);min-width:100px;text-align:right}
</style>

}
function fr(v){return v==null?'—':(v>=0?'+':'')+v.toFixed(0)+'%';}
function fm(v){if(!v)return'—';if(v>=1e12)return(v/1e12).toFixed(1)+'T';if(v>=1e9)return(v/1e9).toFixed(0)+'B';return(v/1e9).toFixed(1)+'B';}
function fsh(v){if(v==null)return'—';return v.toFixed(1);}
function ssh(v){if(v==null)return{c:'#aaa',fw:'400'};if(v>=1)return{c:'#1F7A4E',fw:'700'};if(v<0)return{c:'#C5402B',fw:'700'};return{c:'#B8870A',fw:'500'};}

function render(rows){
  if(col)rows=[...rows].sort((a,b)=>{
    let va=a[col],vb=b[col];
    if(va==null)return 1;if(vb==null)return-1;
    return va<vb?dir:va>vb?-dir:0;
  });
  document.getElementById('tbody').innerHTML=rows.map(r=>{
    const rc=PERIODS.map(p=>{const s=rs(r[p]);return`<td class=cr-ret style="background:${s.bg};color:${s.c};font-weight:${s.fw}">${fr(r[p])}</td>`;}).join('');
    return`<tr>
      <td class=ct>${r.symbol}</td>
      <td class=cn title="${r.name}">${r.name}</td>
      <td class=cs>${r.sector||'—'}</td>

      <td class=cm>${fm(r.mcap)}</td>
      <td class=cp>${r.price!=null?'$'+r.price.toFixed(0):'—'}</td>
      ${rc}
      <td class=cr style="color:${ssh(r.sharpe).c};font-weight:${ssh(r.sharpe).fw}">${fsh(r.sharpe)}</td>
      <td class=cr style="color:${ssh(r.sharpe6m).c};font-weight:${ssh(r.sharpe6m).fw}">${fsh(r.sharpe6m)}</td>
      <td class=cr-score>${r.custom!=null?r.custom:'—'}</td>
    </tr>`;
  }).join('');
  document.getElementById('count').textContent=rows.length+' 条';
}

const RLO=8.5,RHI=12.75;
let mcapLo=0,mcapHi=Infinity;
function fmv(log){const v=Math.pow(10,log);if(v>=1e12)return'$'+(v/1e12).toFixed(1)+'T';if(v>=1e9)return'$'+(v/1e9).toFixed(0)+'B';return'$'+(v/1e6).toFixed(0)+'M';}
function updateRng(){
  const lo=parseFloat(document.getElementById('rng-lo').value);
  const hi=parseFloat(document.getElementById('rng-hi').value);
  const pl=(lo-RLO)/(RHI-RLO)*100,ph=(hi-RLO)/(RHI-RLO)*100;
  const fill=document.getElementById('rng-fill');
  fill.style.left=pl+'%';fill.style.width=(ph-pl)+'%';
  mcapLo=lo<=RLO?0:Math.pow(10,lo);
  mcapHi=hi>=RHI?Infinity:Math.pow(10,hi);
  const allRange=lo<=RLO&&hi>=RHI;
  document.getElementById('mcap-val').textContent=allRange?'全部':fmv(lo)+' – '+(hi>=RHI?'∞':fmv(hi));
  render(filtered());
}
document.getElementById('rng-lo').addEventListener('input',function(){
  if(+this.value>+document.getElementById('rng-hi').value)this.value=document.getElementById('rng-hi').value;
  updateRng();
});
document.getElementById('rng-hi').addEventListener('input',function(){
  if(+this.value<+document.getElementById('rng-lo').value)this.value=document.getElementById('rng-lo').value;
  updateRng();
});

// 数值范围滑块（通用）
const NUM_FILTERS=[
  {id:'ret1m', field:'1M',       lo:-55, hi:455, fmt:v=>(v>=0?'+':'')+v+'%'},
  {id:'ret3m', field:'3M',       lo:-85, hi:670, fmt:v=>(v>=0?'+':'')+v+'%'},
  {id:'sh3m',  field:'sharpe',   lo:-11.75,  hi:11.5,  fmt:v=>v.toFixed(1)},
  {id:'sh6m',  field:'sharpe6m', lo:-11.75, hi:11.5, fmt:v=>v.toFixed(1)},
];
const nfState={};
// 第一遍：先把所有状态初始化，避免 filtered() 里访问到 undefined
NUM_FILTERS.forEach(f=>{ nfState[f.id]={lo:f.lo,hi:f.hi}; });
// 第二遍：绑定事件并初始化填充条
NUM_FILTERS.forEach(f=>{
  const loEl=document.getElementById('rng-lo-'+f.id);
  const hiEl=document.getElementById('rng-hi-'+f.id);
  const fill=document.getElementById('rng-fill-'+f.id);
  const val =document.getElementById('fv-'+f.id);
  function upd(){
    const lo=parseFloat(loEl.value),hi=parseFloat(hiEl.value);
    const span=f.hi-f.lo;
    fill.style.left=((lo-f.lo)/span*100)+'%';
    fill.style.width=((hi-lo)/span*100)+'%';
    nfState[f.id]={lo,hi};
    val.textContent=(lo===f.lo&&hi===f.hi)?'全部':f.fmt(lo)+' – '+f.fmt(hi);
    render(filtered());
  }
  loEl.addEventListener('input',function(){if(+this.value>+hiEl.value)this.value=hiEl.value;upd();});
  hiEl.addEventListener('input',function(){if(+this.value<+loEl.value)this.value=loEl.value;upd();});
  upd();
});

// 行业下拉
(function(){
  const sel=document.getElementById('sector-sel');
  const sectors=[...new Set(DATA.map(r=>r.sector).filter(Boolean))].sort();
  sectors.forEach(s=>{const o=document.createElement('option');o.value=s;o.textContent=s;sel.appendChild(o);});
  sel.addEventListener('change',()=>render(filtered()));
})();

function filtered(){
  const q=document.getElementById('search').value.trim().toLowerCase();
  const sec=document.getElementById('sector-sel').value;
  let rows=q?DATA.filter(r=>r.symbol.toLowerCase().includes(q)||r.name.toLowerCase().includes(q)||r.sector.toLowerCase().includes(q)):DATA;
  if(sec)rows=rows.filter(r=>r.sector===sec);
  if(mcapLo>0||mcapHi<Infinity)rows=rows.filter(r=>!r.mcap?(mcapLo===0):r.mcap>=mcapLo&&r.mcap<=mcapHi);
  NUM_FILTERS.forEach(f=>{
    const {lo,hi}=nfState[f.id];
    if(lo!==f.lo||hi!==f.hi)rows=rows.filter(r=>r[f.field]!=null&&r[f.field]>=lo&&r[f.field]<=hi);
  });
  return rows;
}

window.exportCSV=function(){
  const cols=['symbol','name','sector','mcap','price',...PERIODS,'sharpe','sharpe6m','custom'];
  const hdrs=['Ticker','公司名','行业','市值(B)','现价',...PERIODS,'Sharpe3M','Sharpe6M','自定义'];
  const rows=filtered();
  const lines=[hdrs.join(',')].concat(rows.map(r=>cols.map(c=>{
    let v=r[c];
    if(v==null)return'';
    if(c==='mcap')return v>=1e12?(v/1e12).toFixed(1)+'T':v>=1e9?(v/1e9).toFixed(0)+'B':(v/1e9).toFixed(1)+'B';
    if(typeof v==='string'&&v.includes(','))return'"'+v+'"';
    return v;
  }).join(',')));
  const blob=new Blob(['﻿'+lines.join('\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='returns_'+new Date().toISOString().slice(0,10)+'.csv';
  a.click();
};

window.sortBy=function(c){
  if(col===c)dir*=-1;else{col=c;dir=c==='symbol'?1:-1;}
  document.querySelectorAll('th').forEach(t=>{if(t.querySelector('.si'))t.querySelector('.si').textContent='';});
  const si=document.querySelector(`[data-col="${c}"] .si`);if(si)si.textContent=dir>0?' ▲':' ▼';
  render(filtered());
};

document.getElementById('search').addEventListener('input',()=>render(filtered()));
const si=document.querySelector(`[data-col="${col}"] .si`);if(si)si.textContent=' ▼';
updateRng();
</script>
